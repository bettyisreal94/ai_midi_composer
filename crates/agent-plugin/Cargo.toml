[package]
name = "agent-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
agent-core = { path = "../agent-core" }
agent-ui = { path = "../agent-ui" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23" }
rfd = "0.14"
keyring = "3"
triple_buffer = "7"
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.bundler]
name = "AI MIDI Agent"
identifier = "com.example.ai-midi-agent"
